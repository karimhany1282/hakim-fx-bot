name: one-off chat id lookup

on:
  workflow_dispatch:

jobs:
  chatid:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: fetch getUpdates with retries
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          ok=0
          for i in 1 2 3 4 5 6 7; do
            code=$(curl -s -w "%{http_code}" "https://api.telegram.org/bot${TELEGRAM_TOKEN}/getUpdates?offset=-100" -o updates.json)
            if [ "$code" = "200" ]; then ok=1; break; fi
            echo "attempt $i: HTTP $code $(head -c 120 updates.json)"
            sleep 45
          done
          if [ "$ok" != "1" ]; then echo "GAVE_UP"; exit 0; fi
          python3 - <<'PY'
          import json
          d = json.load(open('updates.json'))
          if not d.get('ok'):
              print('API_ERROR', d.get('description'))
          seen = set()
          for u in d.get('result', []):
              for key in ('channel_post', 'my_chat_member', 'message'):
                  m = u.get(key)
                  if not m:
                      continue
                  c = m.get('chat', {})
                  seen.add((c.get('id'), c.get('type'), c.get('title') or c.get('username')))
              if 'my_chat_member' in u:
                  c = u['my_chat_member'].get('chat', {})
                  seen.add((c.get('id'), c.get('type'), c.get('title')))
          for s in sorted(seen, key=str):
              print('CHAT:', s)
          if not seen:
              print('NO_UPDATES')
          PY
