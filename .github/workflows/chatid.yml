name: send test message

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: send test message
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ok=0
          for i in 1 2 3 4 5; do
            code=$(curl -s -w "%{http_code}" --max-time 30 -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=✅ تم تشغيل بوت HAKIM_FX وربطه بالقناة. كل إشارة جديدة هتوصل هنا تلقائيًا." -o resp.json)
            if [ "$code" = "200" ]; then ok=1; echo "SENT_OK"; break; fi
            echo "attempt $i: HTTP $code $(head -c 120 resp.json)"
            sleep 40
          done
          if [ "$ok" != "1" ]; then echo "SEND_FAILED"; exit 1; fi
