name: HAKIM_FX signals

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hakim-fx-signals
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: run signal bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_RELAY: ${{ secrets.TELEGRAM_RELAY }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROVIDER: ${{ vars.PROVIDER || 'oanda' }}
          OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          NOTIFY_OUTCOMES: ${{ vars.NOTIFY_OUTCOMES || '1' }}
        run: python bot.py

      - name: save state
        run: |
          git config user.name "hakim-fx-bot"
          git config user.email "hakim-fx-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "state update"
          git push
